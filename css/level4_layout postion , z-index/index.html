<!DOCTYPE html>
<html>
<head>
    <title>position & z-index</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Property</h1>

    <div class="static">
        Static Position
    </div>


    <div class="relative">
        Relative Position
    </div>

    
    <div class="parent">
        Parent

        <div class="absolute">
            Absolute Position
        </div>
    </div>

    
    <div class="fixed">
        Fixed Position
    </div>

    
    <div class="sticky">
        Sticky Position
    </div>


    <h1>Z-Index</h1>

    <div class="box1">
        Box 1
    </div>

    <div class="box2">
        Box 2
    </div>

</body>
</html>
