<!DOCTYPE html>
<html>
<head>
    <title>Display, Visibility & RGBA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Display</h1>

    <div class="block">Block Element</div>

    <span class="inline">Inline Element 1</span>
    <span class="inline">Inline Element 2</span>

    <div class="inline-block">Inline Block Element</div>

    <h1>Display None</h1>

    <div class="none">
        This element is hidden using display none.
    </div>


    <h1>Visibility</h1>

    <div class="hidden">
        This element is hidden using visibility hidden.
    </div>

    <div class="visible">
        This element is visible.
    </div>


    <h1>RGBA</h1>

    <div class="rgba">
        This box uses RGBA.
    </div>

</body>
</html>
